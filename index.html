<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; background: #111418; color: #e8ecef; }
        canvas { display: block; }
        #menu {
            position: absolute; inset: 0; background: rgba(14, 17, 22, 0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }
        h1 { font-size: 3.4rem; margin-bottom: 22px; color: #6ba382; letter-spacing: 3px; }
        input {
            padding: 12px 20px; font-size: 1.05rem; border-radius: 25px; border: 2px solid #3b7a57;
            outline: none; margin-bottom: 20px; text-align: center; width: 260px; background: #1a1f26; color: #e8ecef;
        }
        button#btnJugar {
            padding: 12px 50px; font-size: 1.15rem; border-radius: 25px; border: none;
            background: #3b7a57; color: #e8ecef; font-weight: bold; cursor: pointer;
        }
        button#btnJugar:hover { background: #478f67; }
        #leaderboard {
            position: absolute; top: 15px; right: 15px; background: rgba(15, 18, 22, 0.65);
            padding: 12px 18px; border-radius: 10px; min-width: 190px; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.08);
        }
        #leaderboard h3 { margin-bottom: 8px; color: #6ba382; font-size: 0.95rem; border-bottom: 1px solid #282e38; padding-bottom: 4px; }
        #listaTop { list-style: none; font-size: 0.88rem; }
        #listaTop li { margin: 4px 0; display: flex; justify-content: space-between; color: #d0d7de; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>SLITHER</h1>
        <input type="text" id="nombreInput" placeholder="Tu apodo..." maxlength="15">
        <button id="btnJugar">Jugar</button>
    </div>

    <div id="leaderboard">
        <h3>Top Jugadores</h3>
        <ul id="listaTop"></ul>
    </div>

    <canvas id="juego"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
