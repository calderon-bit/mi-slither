<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slither Clone</title>
    <style>
        body { margin: 0; overflow: hidden; background: #161c22; font-family: Arial, sans-serif; }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(15, 20, 25, 0.85); color: white; z-index: 10;
        }
        h1 { font-size: 60px; color: #00ff88; text-shadow: 0 0 20px #00ff88; margin-bottom: 20px; }
        input { padding: 15px; font-size: 18px; border-radius: 25px; border: none; text-align: center; outline: none; margin-bottom: 15px; }
        button { padding: 15px 40px; font-size: 20px; border-radius: 25px; border: none; background: #00ff88; color: #111; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px #00ff88; }
        button:hover { background: #00cc6a; }
        #ranking {
            position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.5);
            color: white; padding: 15px; border-radius: 10px; min-width: 180px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>SLITHER</h1>
        <input type="text" id="nombreInput" placeholder="Tu apodo..." maxlength="15">
        <button id="jugarBtn">Jugar</button>
    </div>

    <div id="ranking">
        <strong>Top Jugadores</strong>
        <ol id="listaRanking" style="padding-left: 20px; margin-top: 8px;"></ol>
    </div>

    <canvas id="juego"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
